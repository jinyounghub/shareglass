name: Bug report
about: Report an incorrect finding, parser failure, or safe-copy problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real private documents. Create a minimal synthetic reproducer.
  - type: input
    id: version
    attributes:
      label: ShareGlass version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: File format
      options: [JPEG, PNG, WebP, DOCX, XLSX, PPTX, PDF, Other]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and observed behavior plus browser/Node.js version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real personal/company information from all examples.
          required: true
        - label: This is not a security vulnerability requiring private reporting.
          required: true
