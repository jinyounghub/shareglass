name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run ci
      - name: Build release archives
        run: |
          mkdir release
          npm pack --pack-destination release
          git archive --format=tar.gz --prefix="shareglass-${GITHUB_REF_NAME}/" -o "release/shareglass-source-${GITHUB_REF_NAME}.tar.gz" HEAD
          tar -C dist -czf "release/shareglass-static-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum release/* > release/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "ShareGlass $GITHUB_REF_NAME"
      - name: Publish npm package
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        run: npm publish release/jin0-shareglass-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
