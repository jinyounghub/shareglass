name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: CLI smoke test
        run: node bin/shareglass.mjs scan samples/private-resume.docx --fail-on critical || test $? -eq 2
      - name: Upload static build
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: shareglass-static
          path: dist
          if-no-files-found: error
