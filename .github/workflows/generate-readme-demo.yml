name: Generate README demo

on:
  push:
    branches: [codex/issue-4-readme-demo]
    paths:
      - scripts/record-readme-demo.mjs
      - .github/workflows/generate-readme-demo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install GIF encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm run build
      - name: Record and encode README demo
        run: node scripts/record-readme-demo.mjs
      - name: Show asset metadata
        run: |
          file assets/privacy-reveal.gif
          du -h assets/privacy-reveal.gif
          cat tmp/readme-demo/manifest.json
      - name: Commit generated README demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/privacy-reveal.gif
          git commit -m "docs: add generated README privacy demo"
          git push
      - name: Upload README demo and source frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shareglass-readme-demo
          path: |
            assets/privacy-reveal.gif
            tmp/readme-demo/*.png
            tmp/readme-demo/timeline.ffconcat
            tmp/readme-demo/manifest.json
          if-no-files-found: warn
